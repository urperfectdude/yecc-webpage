    <title>YourERPCoach website versions</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Helvetica Neue", Arial, system-ui, sans-serif; color: #0d2344; background: #f4f8fe; }
      main { width: 100%; max-width: 560px; }

      a:hover { border-color: #2b72d9; }
      strong { display: block; font-size: 1.1rem; color: #2b72d9; }
      span { color: #3c5173; font-size: 0.95rem; }

    <main>
